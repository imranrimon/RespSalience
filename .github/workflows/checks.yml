name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The datasets and trained artifacts are not public, so the numerical
      # verification cannot run here. What CI can guarantee is that every
      # analysis entry point is syntactically valid and imports cleanly.
      - name: Byte-compile all sources
        run: python -m compileall -q scripts src

      - name: Manuscript consistency (labels, citations, floats)
        run: python tools/check_manuscript.py

      # Reports how many result-like numbers no analysis script re-derives. Advisory: the datasets
      # are not public, so CI cannot run the numerical verification itself. It exists so a drop in
      # coverage is visible in the log when a section is added without harness support -- which is
      # how every number error in this paper's history went unnoticed.
      # --strict fails the build if reader-facing Markdown states a result the paper does not claim.
      # The LaTeX coverage figure stays advisory (CI has no datasets), but README drift is cheap to
      # catch and expensive to ship: the front page advertised a superseded model for several commits.
      - name: Claim-coverage audit
        run: python tools/audit_claims.py --strict
