[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "respsalience"
version = "1.0.0"
description = "Decision-aware contactless pediatric tachypnea screening (RespSalience)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Imran Hossain", email = "muhammadimran.hossain@mail.wvu.edu" }]

# Authoritative pinned spec is environment.yml (conda). requirements.txt is a minimal pip subset.
dependencies = [
    "torch>=2.8",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "opencv-python",
    "transformers",
    "librosa",
    "mediapipe",
    "ultralytics",
    "matplotlib",
    "imageio",
    "openpyxl",
]

[project.optional-dependencies]
app = ["streamlit", "fastapi", "uvicorn"]

[tool.setuptools]
packages = ["respsalience"]
package-dir = { respsalience = "src" }

[tool.setuptools.package-data]
prism_breath = ["config/*.yaml"]

# ---- conventions (see README.md for the full map) ----
# src/            importable package (core models, fusion, utils, config)
# scripts/        run-from-root CLIs; grouped by category in README (paths are root-relative by design)
# tests/          standalone self-checking test_*.py (no pytest suite)
# docs/           design docs, runbooks, reviewer critique, results tables, paper positioning
# manuscript/     IEEE MTT paper (Overleaf-ready): prism_breath.tex + .bib + 600-DPI figs
# tools/          one-off utilities (pdf extraction, project reorg helper)
# data/ outputs/ external/   gitignored (datasets, results/checkpoints, vendored third-party)

[project.urls]
Homepage = "https://github.com/imranrimon/RespSalience"
Repository = "https://github.com/imranrimon/RespSalience"
